format_version: "4"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ""
app:
  envs:
  - RELEASE_START_BRANCH: master
  - RELEASE_DESTINATION_BRANCH: prod
  - PORT: 3012
  - HEROKU_APP_NAME: bitrise-step-analytics
workflows:
  start:
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            if [ "$IS_USE_GIN" == "yes" ] ; then
              go get github.com/codegangsta/gin
              docker-compose up
            else
              go install
              bitrise-step-analytics
            fi
  test:
    envs:
    - GOROOT: "" # the Go step toolkit messes up the environment by overriding this
    steps:
    - script@1:
        title: Run golangci-lint
        inputs:
        - content: |-
            #!/bin/env bash
            set -xeo pipefail
            asdf install golang
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b ~/.local/bin v2.3.0
            golangci-lint run --timeout 5m
    - script@1:
        title: Run tests
        inputs:
        - content: go test -v ./...
